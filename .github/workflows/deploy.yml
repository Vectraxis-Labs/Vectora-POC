name: Deploy to DigitalOcean

# -----------------------------------------------------------------------------
# This workflow runs on CODE cadence only: test, then deploy.
#
# It deliberately does NOT run Packer (image bakes) or Terraform (infra
# changes). Those are slower, rarer, and -- in Terraform's case -- destructive,
# so you run them by hand from your machine. See the RUNBOOK comment at the
# bottom of this file for "when do I run what".
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - main

# If you push twice in quick succession, cancel the older in-flight run so two
# deploys can't race each other onto the same droplet.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # -- Job 1: Test --------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and lint backend
        run: |
          pip install flake8
          cd server
          flake8 . --count --select=E9,F63,F7,F82 \
            --show-source --statistics \
            --exclude=.venv,venv,__pycache__

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and lint frontend
        run: |
          cd client
          npm install
          npm run lint

  # -- Job 2: Deploy ------------------------------------------------------------
  # Only runs if the test job passed. There is no checkout here on purpose -- the
  # droplet pulls the code itself, so the runner just needs SSH access to tell it
  # to. The runner never holds a copy of the repo for the deploy.
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Load SSH key into the agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Private half of the key whose PUBLIC half DigitalOcean injected into
          # the droplet (your "vectora-key"). This is what lets the runner SSH in
          # as root. It is NOT the same key the droplet uses to talk to GitHub.
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -T 60 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "Could not reach the server -- aborting before we touch it."
            exit 1
          fi

      - name: Pull latest code and restart containers
        run: |
          ssh root@${{ secrets.SERVER_IP }} 'bash -s' << 'ENDSSH'
          set -e
          cd /app
          echo ">>> Fetching origin and resetting to main..."
          git fetch --all --prune
          git reset --hard origin/main
          echo ">>> Rebuilding and restarting containers..."
          docker compose -f docker-compose.yml up -d --build --remove-orphans
          echo ">>> Reclaiming disk from old image layers..."
          docker image prune -f
          echo ">>> Done."
          ENDSSH

      - name: Verify the API is healthy
        run: |
          echo "Polling /api/health until it responds..."
          for attempt in $(seq 1 10); do
            if curl --fail --silent "http://${{ secrets.SERVER_IP }}/api/health"; then
              echo ""
              echo "Healthy on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: not ready, retrying in 6s..."
            sleep 6
          done
          echo "API never became healthy -- failing the deploy."
          exit 1

# =============================================================================
# RUNBOOK -- when do I run what?
# -----------------------------------------------------------------------------
# App code change (.py, .tsx, ...)        -> just `git push`     (auto, ~1-2 min)
# App dependency change (requirements/    -> just `git push`     (auto, ~2-4 min;
#   package.json)                            the image rebuilds in place)
#
# Infra change (open a port, resize the   -> by hand, on your machine:
#   droplet, DNS, DB settings)                 cd infra
#                                              terraform plan      # READ this
#                                              terraform apply
#   (Won't recreate the droplet, because of lifecycle.ignore_changes = [image].)
#
# Base-image / system change (OS patch,   -> by hand, on your machine:
#   change baked Nginx/systemd, bump          cd infra/packer
#   Docker)                                    packer build -var-file=... vectora.pkr.hcl
#                                            then deliberately cycle the box:
#                                              cd ..
#                                              terraform apply -replace=digitalocean_droplet.vectora
#
# Spin up from nothing  -> ./up.sh     (a snapshot must already exist)
# Tear down             -> ./destroy.sh   (NOT bare `terraform destroy`)
# =============================================================================