name: Deploy to DigitalOcean

# -----------------------------------------------------------------------------
# Runs on CODE cadence only: test, then deploy.
#
# It does NOT provision infrastructure. The droplet is created/configured by
# Terraform + cloud-init (which clones the repo to /app and builds the prod
# images on first boot). This pipeline only updates code on the already-running
# droplet. Terraform is run by hand from a dev machine.
#
# Target is the DOMAIN, not a fixed IP: the droplet has no reserved IP, so its
# IP churns on every recreate. DNS (managed in dns.tf) always points the domain
# at the current droplet, so deploying to the hostname follows the box.
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  # Single source of truth for where we deploy. No raw IP anywhere.
  DEPLOY_HOST: vectraxis-labs.com

jobs:
  # -- Job 1: Test --------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and lint backend
        run: |
          pip install flake8
          cd server
          flake8 . --count --select=E9,F63,F7,F82 \
            --show-source --statistics \
            --exclude=.venv,venv,__pycache__

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and lint frontend
        run: |
          cd client
          npm install
          npm run lint

  # -- Job 2: Deploy ------------------------------------------------------------
  # Only runs if tests pass. The droplet pulls the code itself; the runner just
  # SSHes in to trigger it.
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Load SSH key into the agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull latest code and restart containers
        run: |
          # PoC NOTE: strict host-key checking is disabled on purpose. The
          # droplet is disposable and its host key changes on every recreate,
          # which would otherwise trip SSH's "host identification changed"
          # block. Acceptable for a PoC against a throwaway box; revisit before
          # anything resembling production.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@${DEPLOY_HOST} 'bash -s' << 'ENDSSH'
          set -e
          cd /app
          echo ">>> Fetching origin and resetting to main..."
          git fetch --all --prune
          git reset --hard origin/main
          echo ">>> Rebuilding and restarting PROD containers..."
          docker compose -f docker-compose.yml up -d --build --remove-orphans
          echo ">>> Reclaiming disk from old image layers..."
          docker image prune -f
          echo ">>> Done."
          ENDSSH

      - name: Verify the API is healthy
        run: |
          echo "Polling https://${DEPLOY_HOST}/api/health until it responds..."
          for attempt in $(seq 1 10); do
            if curl --fail --silent "https://${DEPLOY_HOST}/api/health"; then
              echo ""
              echo "Healthy on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: not ready, retrying in 6s..."
            sleep 6
          done
          echo "API never became healthy -- failing the deploy."
          exit 1