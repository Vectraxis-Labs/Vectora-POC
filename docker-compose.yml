# docker-compose.yml
# PRODUCTION base. The droplet runs this explicitly: `docker compose -f docker-compose.yml up`.
# It builds the sealed production images and runs each service's production CMD --
# no bind mounts, no dev servers, no source mounted. The container runs exactly the image.
#
# Locally, a plain `docker compose up` auto-merges docker-compose.override.yml on top of
# this and re-adds the dev conveniences. The droplet never loads the override because it
# names this file explicitly with -f.

services:
  # -- PostgreSQL + pgvector (identical in dev and prod) --
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: vectora
      POSTGRES_PASSWORD: vectora
      POSTGRES_DB: vectora
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on a fresh data dir: enables the pgvector extension.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    # No published ports: only the backend reaches the DB, over the internal compose
    # network at "db:5432". Local tooling access is added in the override.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vectora" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- Redis (identical in dev and prod) --
  redis:
    image: redis:7.2-alpine
    restart: always
    # No published ports: only the backend uses it ("redis:6379").
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- FastAPI backend (production image) --
  backend:
    build:
      context: ./server
      target: runtime # the slim production stage
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vectora:vectora@db:5432/vectora
      REDIS_URL: redis://redis:6379
    # Only the host's Nginx needs to reach this -- bind to localhost, not 0.0.0.0.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No volumes, no command: runs the Dockerfile's production CMD
    # (uvicorn, no --reload, 4 workers) on the baked code.

    # -- Next.js frontend (production image) --
  frontend:
    build:
      context: ./client
      target: runner # the slim production stage
    restart: always
    env_file:
      - .env
    # NOTE: NEXT_PUBLIC_* values are baked into the client bundle at BUILD time
    # (during `npm run build`), so setting NEXT_PUBLIC_API_URL here as a runtime env
    # var would NOT reach the browser bundle. In production the code falls back to
    # "/api" (client/lib/api.ts) and the droplet's Nginx routes /api -> backend. To
    # bake a non-relative value, pass it as a build arg, not a runtime env var.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    # No volumes, no command: runs the Dockerfile CMD (`npm run start`) serving the
    # prebuilt .next output -- no file watching, no per-request compile.

volumes:
  postgres_data:
